<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Low-G</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ffa31a' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23ffa31a'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; }

      /* The loading screen. It lives here, not in the game's code, so it shows the moment
         the page opens, before the code has finished downloading. It lines up with the
         main menu underneath, so when it fades out only the menu buttons appear. */
      #loading { position: fixed; inset: 0; z-index: 10; background: #000; color: #f5f0e8;
        font: 13px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: 0.06em;
        text-transform: uppercase; transition: opacity 0.8s ease; }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading .column { width: min(512px, 100%); padding: 64px 0 48px 72px; box-sizing: border-box;
        display: flex; flex-direction: column; gap: 22px; }
      #loading h1 { margin: 0; font-size: 64px; letter-spacing: 0.28em; color: #ffa31a; font-weight: 700; }
      #loading .tagline { color: #bdb6aa; letter-spacing: 0.24em; margin-top: -12px; }
      #loading .track { height: 3px; background: rgba(245, 240, 232, 0.18); margin-top: 18px; }
      #loading .fill { height: 100%; background: #ffa31a; transform-origin: left; transform: scaleX(0.02);
        transition: transform 0.25s ease-out; }
      #loading .status { display: flex; justify-content: space-between; gap: 16px; color: #bdb6aa;
        font-size: 11px; letter-spacing: 0.16em; line-height: 1.7; }
      #loading .tip { position: absolute; left: 72px; right: 24px; bottom: 48px; color: #8a8379; font-size: 11px;
        letter-spacing: 0.14em; line-height: 1.7; }
      #loading.failed .fill { background: #ff5a1f; }
      #loading.failed .step { color: #ff5a1f; }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="column">
        <h1>LOW-G</h1>
        <div class="tagline">LUNAR TARGET RANGE</div>
        <div class="track"><div class="fill"></div></div>
        <div class="status"><span class="step">LOADING</span><span class="percent"></span></div>
      </div>
      <div class="tip"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
